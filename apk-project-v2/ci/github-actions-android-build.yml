name: Android source build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apk-project-v2/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: apk-project-v2
        run: npm ci

      - name: Sync website into Capacitor www
        working-directory: apk-project-v2
        run: python3 sync_www.py

      - name: Copy web assets into Android project
        working-directory: apk-project-v2
        run: npx cap copy android

      - name: Build debug APK from source
        working-directory: apk-project-v2/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aoxi-tools-debug-apk
          path: apk-project-v2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
