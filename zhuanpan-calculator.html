        { key: 'box1', name: '宝物材料选择箱 I', amount: 1, unit: '个', icon: BOX_ICONS[1], box: 1 },
        { key: 'fire', name: '火花核心', amount: 15, unit: '个', icon: ITEM_ICONS.fire },
        { key: 'medal', name: '功绩勋章', amount: 10, unit: '个', icon: ITEM_ICONS.medal },
        { key: 'exp', name: '1 级经验勋章袋', amount: 1, unit: '个', icon: ITEM_ICONS.exp },
        { key: 'summon', name: '新生代召唤卡', amount: 2, unit: '个', icon: ITEM_ICONS.summon }
      ]
    },
    3: {
      label: '第 3 圈', range: '12～18 点', type: '红装圈',
      rewards: [
        { key: 'red', name: '红装碎片', amount: 4, unit: '片', icon: RED_ICON },
        { key: 'crystal', name: '赤红晶石', amount: 8, unit: '个', icon: ITEM_ICONS.crystal },
        { key: 'key', name: '绿色钥匙袋', amount: 1, unit: '个', icon: ITEM_ICONS.key },
        { key: 'ribbon', name: '荣誉绶带', amount: 2, unit: '个', icon: ITEM_ICONS.ribbon },
        { key: 'summon', name: '新生代召唤卡', amount: 6, unit: '个', icon: ITEM_ICONS.summon },
        { key: 'universal', name: 'L 万能碎片', amount: 3, unit: '个', icon: ITEM_ICONS.universal }
      ]
    },
    4: {
      label: '第 4 圈', range: '18～24 点', type: '突破圈',
      rewards: [
        { key: 'break', name: '突破碎片', amount: 45, unit: '片', icon: BREAK_ICON },
        { key: 'box2', name: '宝物材料选择箱 II', amount: 1, unit: '个', icon: BOX_ICONS[2], box: 2 },
        { key: 'key', name: '绿色钥匙袋', amount: 1, unit: '个', icon: ITEM_ICONS.key },
        { key: 'medal', name: '功绩勋章', amount: 10, unit: '个', icon: ITEM_ICONS.medal },
        { key: 'universal', name: 'L 万能碎片', amount: 8, unit: '个', icon: ITEM_ICONS.universal },
        { key: 'jade', name: '紫翠玉', amount: 10, unit: '个', icon: ITEM_ICONS.jade }
      ]
    }
  };

  var presetBtns = Array.prototype.slice.call(document.querySelectorAll('[data-preset]'));
  var roundSelect = document.getElementById('round-select');
  var rankInput = document.getElementById('rank-shards');
  var investmentInput = document.getElementById('investment');
  var state = { preset: 'once', plan: null };
  var out = {
    planSummary: document.getElementById('plan-summary'),
    drawPreview: document.getElementById('draw-preview'),
    totalDraws: document.getElementById('total-draws'),
    tickets: document.getElementById('tickets'),
    actualCost: document.getElementById('actual-cost'),
    boxIcons: document.getElementById('box-icons'),
    boxLabel: document.getElementById('box-label'),
    boxValue: document.getElementById('box-value'),
    secondaryIcons: document.getElementById('secondary-icons'),
    secondaryLabel: document.getElementById('secondary-label'),
    secondaryValue: document.getElementById('secondary-value'),
    redValue: document.getElementById('red-value'),
    detailList: document.getElementById('detail-list'),
    rewardList: document.getElementById('reward-list')
  };

  function toInt(el, min, max, fallback) {
    var value = Number.parseInt(el.value, 10);
    if (!Number.isFinite(value)) value = fallback;
    return Math.max(min, Math.min(max, value));
  }

  function fmt(value) {
    return Math.round(value).toLocaleString('zh-CN');
  }

  function ticketCount(draws) {
    return Math.floor(draws / 10) * 9 + draws % 10;
  }

  function trialRedForDraws(draws) {
    var fullRounds = Math.min(Math.floor(draws / 1000), TRIAL_MAX);
    var red = fullRounds * (TRIAL_700_RED + TRIAL_1000_RED);
    var progress = draws % 1000;
    if (fullRounds < TRIAL_MAX && progress >= 700) red += TRIAL_700_RED;
    return red;
  }

  function drawsForBudget(budget) {
    var tenPulls = Math.floor(budget / 450);
    var remainder = budget % 450;
    return tenPulls * 10 + Math.floor(remainder / 50);
  }

  function oncePlan() {
    return [{ stages: [{ round: 4, draws: 3100 }] }];
  }

  function splitPlan() {
    return [
      { stages: [{ round: 4, draws: 1900 }, { round: 1, draws: 100 }] },
      { stages: [{ round: 4, draws: 1200 }] }
    ];
  }

  function customPlan() {
    var round = toInt(roundSelect, 1, 4, 4);
    var budget = toInt(investmentInput, 0, 9999999, 0);
    return [{ stages: [{ round: round, draws: drawsForBudget(budget) }] }];
  }

  function markPreset(name) {
    state.preset = name;
    presetBtns.forEach(function (button) {
      button.classList.toggle('active', button.dataset.preset === name);
    });
  }

  function setPreset(name) {
    if (name === 'once') {
      investmentInput.value = '139500';
      roundSelect.value = '4';
      state.plan = oncePlan();
    } else if (name === 'split') {
      investmentInput.value = '144000';
      roundSelect.value = '4';
      state.plan = splitPlan();
    } else {
      state.plan = customPlan();
    }
    markPreset(name);
    update();
  }

  function countRewardTriggers(draws, rewardIndex) {
    var count = 0;
    var interval = INTERVALS[rewardIndex];
    for (var n = interval; n <= draws; n += interval) {
      var won = true;
      for (var higher = 0; higher < rewardIndex; higher++) {
        if (n % INTERVALS[higher] === 0) { won = false; break; }
      }
      if (won) count++;
    }
    return count;
  }

  function allStages(plan) {
    var stages = [];
    plan.forEach(function (phase) {
      phase.stages.forEach(function (stage) { stages.push(stage); });
    });
    return stages;
  }

  function summarizePlan(plan) {
    if (state.preset === 'split') {
      return '第一次：第 4 圈 1,900 抽 + 第 1 圈 100 抽；第二次：第 4 圈 1,200 抽';
    }
    if (state.preset === 'once') return '第 4 圈 × 3,100 抽';
    var stage = allStages(plan)[0];
    var round = ROUNDS[stage.round];
    return round.label + ' · ' + round.range + '（' + round.type + '）× ' + fmt(stage.draws) + ' 抽';
  }

  function addReward(totals, reward, count) {
    var existing = totals[reward.key];
    if (!existing) {
      existing = totals[reward.key] = {
        key: reward.key, name: reward.name, unit: reward.unit, amount: 0,
        triggers: 0, interval: reward.interval, icon: reward.icon || '', box: reward.box || 0,
        triggerAmounts: []
      };
    }
    if (existing.triggerAmounts.indexOf(reward.amount) < 0) existing.triggerAmounts.push(reward.amount);
    existing.amount += reward.amount * count;
    existing.triggers += count;
  }

  function registerBox(boxes, reward, count) {
    if (!reward.box || !count) return;
    var existing = boxes[reward.box] || (boxes[reward.box] = { count: 0, label: reward.name, icon: reward.icon });
    existing.count += count;
  }

  function renderIcons(container, entries) {
    if (!entries.length) {
      container.innerHTML = '<span class="metric-token">奖</span>';
      return;
    }
    var pair = entries.length > 1;
    container.innerHTML = entries.map(function (entry) {
      return '<img class="metric-icon' + (pair ? ' small-pair' : '') + '" src="' + entry.icon + '" width="' + (pair ? 36 : 48) + '" height="' + (pair ? 36 : 48) + '" alt="' + entry.label + '图标">';
    }).join('');
  }

  function update() {
    var plan = state.plan || customPlan();
    var stages = allStages(plan);
    var totalDraws = 0;
    var totalTickets = 0;
    var totals = {};
    var boxes = {};
    var trialRed = 0;

    plan.forEach(function (phase) {
      var phaseDraws = 0;
      phase.stages.forEach(function (stage) {
        phaseDraws += stage.draws;
        totalDraws += stage.draws;
        totalTickets += ticketCount(stage.draws);
        var round = ROUNDS[stage.round];
        round.rewards.forEach(function (reward, index) {
          reward.interval = INTERVALS[index];
          var count = countRewardTriggers(stage.draws, index);
          addReward(totals, reward, count);
          registerBox(boxes, reward, count);
        });
      });
      trialRed += trialRedForDraws(phaseDraws);
    });

    var rankShards = toInt(rankInput, 0, 999999, 0);
    var breakTriggers = totals.break ? totals.break.triggers : 0;
    var breakAmount = totals.break ? totals.break.amount : 0;
    var breakValue = breakAmount + rankShards;
    var breakPerTrigger = breakTriggers ? breakAmount / breakTriggers : 45;
    var coreRed = totals.red ? totals.red.amount : 0;
    var redTotal = coreRed + trialRed;
    var actualCost = totalTickets * COST_PER_TICKET;
    var inputBudget = toInt(investmentInput, 0, 9999999, 0);

    out.planSummary.textContent = summarizePlan(plan);
    out.drawPreview.textContent = fmt(totalDraws) + ' 次';
    out.totalDraws.innerHTML = fmt(totalDraws) + '<em>次</em>';
    out.tickets.innerHTML = fmt(totalTickets) + '<em>个</em>';
    out.actualCost.innerHTML = fmt(actualCost) + '<em>光元</em>';
    out.redValue.textContent = fmt(redTotal) + ' 片';

    var boxEntries = Object.keys(boxes).sort(function (a, b) { return Number(a) - Number(b); }).map(function (id) {
      return { id: Number(id), count: boxes[id].count, label: boxes[id].label, icon: boxes[id].icon };
    });
    var boxTotal = boxEntries.reduce(function (sum, entry) { return sum + entry.count; }, 0);
    var shownKeys = {};
    var availableRewards = [];
    stages.forEach(function (stage) {
      ROUNDS[stage.round].rewards.forEach(function (reward) {
        if (totals[reward.key] && totals[reward.key].triggers > 0 && shownKeys[reward.key] !== 'listed') {
          shownKeys[reward.key] = 'listed';
          availableRewards.push(reward);
        }
      });
    });

    function rewardValue(reward) {
      var total = totals[reward.key];
      return total ? fmt(total.amount) + ' ' + total.unit : '0';
    }

    function showReward(iconEl, labelEl, valueEl, reward) {
      var total = totals[reward.key];
      iconEl.innerHTML = '<img class="metric-icon" src="' + reward.icon + '" width="48" height="48" alt="' + reward.name + '图标">';
      labelEl.textContent = reward.name;
      valueEl.textContent = rewardValue(reward);
    }

    if (boxEntries.length) {
      renderIcons(out.boxIcons, boxEntries);
      out.boxLabel.textContent = boxEntries.length === 1 ? boxEntries[0].label : '宝物材料选择箱';
      out.boxValue.textContent = fmt(boxTotal) + ' 个';
      stages.forEach(function (stage) {
        ROUNDS[stage.round].rewards.forEach(function (reward) {
          if (reward.box && boxes[reward.box]) shownKeys[reward.key] = 'shown';
        });
      });
    } else {
      var primary = availableRewards.find(function (reward) { return reward.key !== 'red'; });
      if (primary) {
        showReward(out.boxIcons, out.boxLabel, out.boxValue, primary);
        shownKeys[primary.key] = 'shown';
      } else {
        out.boxIcons.innerHTML = '<span class="metric-token">奖</span>';
        out.boxLabel.textContent = '核心奖励';
        out.boxValue.textContent = '0';
      }
    }

    if (breakValue > 0 && shownKeys.break !== 'shown') {
      out.secondaryIcons.innerHTML = '<img class="metric-icon" src="' + BREAK_ICON + '" width="48" height="48" alt="突破碎片图标">';
      out.secondaryLabel.textContent = '突破碎片';
      out.secondaryValue.textContent = fmt(breakValue) + ' 片';
      shownKeys.break = 'shown';
    } else {
      var secondary = availableRewards.find(function (reward) {
        return reward.key !== 'red' && shownKeys[reward.key] !== 'shown';
      });
      if (secondary) {
        showReward(out.secondaryIcons, out.secondaryLabel, out.secondaryValue, secondary);
        shownKeys[secondary.key] = 'shown';
      } else {
        out.secondaryIcons.innerHTML = '<span class="metric-token">奖</span>';
        out.secondaryLabel.textContent = '后续奖励';
        out.secondaryValue.textContent = '0';
      }
    }

    var detail = [];
    detail.push(['抽取方案', summarizePlan(plan)]);
    detail.push(['转盘券', fmt(totalDraws) + ' 抽 → ' + fmt(totalTickets) + ' 券 × 50 = ' + fmt(actualCost) + ' 光元']);
    if (inputBudget !== actualCost) detail.push(['投入光元', fmt(inputBudget) + ' 光元（实际使用 ' + fmt(actualCost) + ' 光元）']);
    var breakFormula = fmt(breakTriggers) + ' 次 × ' + fmt(breakPerTrigger) + ' 片';
    if (rankShards) breakFormula += ' + 排名奖励 ' + fmt(rankShards) + ' 片';
    breakFormula += ' = ' + fmt(breakValue) + ' 片';
    detail.push(['突破碎片', breakFormula]);
    detail.push(['红装碎片', (coreRed ? fmt(coreRed) : '0') + ' + 试炼 ' + fmt(trialRed) + ' = ' + fmt(redTotal) + ' 片']);
    out.detailList.innerHTML = detail.map(function (row) {
      return '<dt>' + row[0] + '</dt><dd>' + row[1] + '</dd>';
    }).join('');

    var orderedKeys = [];
    stages.forEach(function (stage) {
      ROUNDS[stage.round].rewards.forEach(function (reward) {
        if (orderedKeys.indexOf(reward.key) < 0) orderedKeys.push(reward.key);
      });
    });
    var rewardHtml = orderedKeys.filter(function (key) { return totals[key]; }).map(function (key) {
      var reward = totals[key];
      var iconHtml = reward.icon ? '<img class="reward-icon" src="' + reward.icon + '" width="36" height="36" alt="" loading="lazy" decoding="async">' : '';
      var perTrigger = reward.triggerAmounts.map(function (amount) { return fmt(amount); }).join('/') + ' ' + reward.unit;
      return '<div class="reward-item">' + iconHtml + '<div class="reward-name"><b><span class="reward-title">' + reward.name + '<small class="reward-per-trigger">' + perTrigger + '</small></span><em class="reward-amount">' + fmt(reward.amount) + ' ' + reward.unit + '</em></b><span class="reward-desc">每 ' + reward.interval + ' 抽触发 · 共 ' + fmt(reward.triggers) + ' 次</span></div></div>';
    });
    rewardHtml.push('<div class="reward-item extra"><img class="reward-icon" src="' + RED_ICON + '" width="36" height="36" alt="" loading="lazy" decoding="async"><div class="reward-name"><b><span class="reward-title">奥特试炼红装奖励</span><em class="reward-amount">' + fmt(trialRed) + ' 片</em></b><span class="reward-desc">每 700 抽给 4 片，每 1,000 抽给 10 片；每轮按 1,000 抽计，最多 4 轮</span></div></div>');
    if (rankShards) {
      rewardHtml.push('<div class="reward-item extra"><img class="reward-icon" src="' + BREAK_ICON + '" width="36" height="36" alt="" loading="lazy" decoding="async"><div class="reward-name"><b><span class="reward-title">排名奖励突破碎片</span><em class="reward-amount">' + fmt(rankShards) + ' 片</em></b><span class="reward-desc">手动填写</span></div></div>');
    }
    out.rewardList.innerHTML = rewardHtml.join('');
  }

  presetBtns.forEach(function (button) {
    button.addEventListener('click', function () { setPreset(button.dataset.preset); });
  });

  roundSelect.addEventListener('change', function () {
    markPreset('custom');
    state.plan = customPlan();
    update();
  });
  investmentInput.addEventListener('input', function () {
    markPreset('custom');
    state.plan = customPlan();
    update();
  });
  rankInput.addEventListener('input', update);
  rankInput.addEventListener('change', update);

  setPreset('once');
})();
</script>
<script src="assets/ak/ripple.js"></script>
<script src="assets/ak/transitions.js"></script>
<script src="assets/ak/progress.js"></script>
<script src="assets/ak/theme.js"></script>

<script>
(function () {
  if (!document.documentElement.hasAttribute('data-calc-embed')) return;
  var lastHeight = 0;
  var queued = false;
  function reportHeight() {
    queued = false;
    var height = Math.ceil(Math.max(document.body.scrollHeight, document.documentElement.scrollHeight));
    if (Math.abs(height - lastHeight) < 2) return;
    lastHeight = height;
    if (window.parent !== window) window.parent.postMessage({ type: 'aoxi-calc-height', height: height }, '*');
  }
  function schedule() {
    if (queued) return;
    queued = true;
    window.requestAnimationFrame(reportHeight);
  }
  window.addEventListener('message', function (event) {
    var data = event.data || {};
    if (data.type === 'aoxi-theme-sync') {
      document.documentElement.setAttribute('data-theme', data.theme === 'light' ? 'light' : 'dark');
      schedule();
    } else if (data.type === 'aoxi-measure') {
      schedule();
    }
  });
  if ('ResizeObserver' in window) new ResizeObserver(schedule).observe(document.documentElement);
  window.addEventListener('load', schedule);
  window.addEventListener('resize', schedule);
  document.addEventListener('DOMContentLoaded', schedule);
  schedule();
})();
</script></body>
