<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e1a" />
<meta name="description" content="预测游戏资源的固定每日收益 × 天数总量" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="assets/favicon-32.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="光元预测" />
<meta name="mobile-web-app-capable" content="yes" />
<title>光元收益预测器</title>
<!-- 主题引导：首帧前定好亮/暗，避免闪色（早于样式表执行） -->
<script>(function(){try{var t=localStorage.getItem('ak-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<link rel="stylesheet" href="assets/calc/calc-base.css">
<link rel="stylesheet" href="assets/ak/ak-theme.css">
<link rel="stylesheet" href="assets/ak/ak-motion.css">
<script>document.documentElement.className+=(" ak-js");window.__akReady=0;setTimeout(function(){if(!window.__akReady){document.querySelectorAll("[data-stagger]>*").forEach(function(e){e.style.transition="none";e.style.opacity="1";e.style.transform="none";});}},3000);</script>
<noscript><style>[data-stagger]>*{opacity:1!important;transform:none!important}</style></noscript>
<link rel="stylesheet" href="assets/calc/calc-override.css">
<link rel="stylesheet" href="assets/ak/ak-components.css">
<script src="assets/ak/counter.js"></script>
<style>
  .header .ttl { min-width: 0; }
</style>
<link rel="stylesheet" href="assets/ak/ak-light.css">
</head>
<body data-ak-progress>
<div class="container">
  <!-- 顶部标题 -->
  <a class="back-home" href="index.html">← 返回首页</a>

  <div class="header">
    <img src="assets/guangyuan.png" alt="光元" class="title-icon" />
    <div class="ttl">
      <h1>光元收益预测器</h1>
      <span class="ak-label-en">Forecast Terminal</span>
    </div>
    <span class="subtitle">每日固定获取量 × 天数 = 预测总量</span>
  </div>

  <!-- 时间选择区 -->
  <div class="time-section">
    <div class="date-group">
      <label for="startDate">起始日期</label>
      <input type="date" id="startDate" />
    </div>
    <div class="date-group">
      <label for="endDate">结束日期</label>
      <input type="date" id="endDate" />
    </div>
    <div class="days-display">
      <span class="label">总天数</span>
      <span class="value" id="daysValue">0</span>
      <span class="sub-info" id="mondayInfo"></span>
    </div>
  </div>

  <!-- 氪金项目区 -->
  <div class="section-header pay-header" id="paySectionHeader">
    <h2>氪金项目 <span class="badge included-badge">已包含</span><span class="badge excluded-badge">已排除</span></h2>
    <label class="toggle-switch pay-toggle">
      <input type="checkbox" id="payToggle" checked />
      <span class="toggle-slider"></span>
    </label>
    <span class="toggle-label">包含氪金收益</span>
  </div>
  <div class="resources-grid" id="payGrid"></div>

  <!-- 游戏内产出区 -->
  <div class="section-header">
    <h2>游戏内产出</h2>
  </div>
  <div class="resources-grid" id="freeGrid"></div>

  <!-- 添加自定义资源按钮 -->
  <button class="add-btn" id="addBtn">+ 添加自定义资源</button>

  <!-- 底部总计 -->
  <div class="footer-section">
    <div class="total-row">
      <div class="total-label">
        <span class="main">预测总获取量</span>
        <span class="sub">所选日期范围内所有资源产出之和</span>
      </div>
      <div class="total-value">
        <span id="totalPredicted">0</span>
        <img src="assets/guangyuan.png" alt="光元" class="icon-large" />
      </div>
    </div>

    <div class="donut-chart-section">
      <div class="donut-chart-title">光元获取构成</div>
      <div class="donut-wrap">
        <svg id="donutChart" viewBox="0 0 200 200" class="donut-svg"></svg>
        <div class="donut-center">
          <span class="donut-center-label">总光元</span>
          <span id="donutCenterValue">0</span>
          <img src="assets/guangyuan.png" alt="光元" class="icon-tiny" />
        </div>
      </div>
      <div class="donut-legend" id="donutLegend"></div>
    </div>

    <div class="existing-row">
      <div class="existing-input-group">
        <label for="existingAmount">
          现有光元数量
          <img src="assets/guangyuan.png" alt="光元" class="icon-small" />
        </label>
        <input type="number" id="existingAmount" min="0" step="1" placeholder="0" />
      </div>
      <div class="grand-total">
        <span class="label">最终合计（现有 + 预测）</span>
        <div class="value">
          <span id="grandTotal">0</span>
          <img src="assets/guangyuan.png" alt="光元" class="icon-large" />
        </div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="reset-btn" id="resetBtn">重置默认</button>
  </div>
</div>

<!-- 移动端固定底部总计栏（桌面端隐藏） -->
<div class="mobile-total-bar" id="mobileTotalBar">
  <span class="mtb-label">最终合计</span>
  <span class="mtb-value">
    <span id="mobileGrandTotal">0</span>
    <img src="assets/guangyuan.png" alt="光元" class="icon-inline" />
  </span>
</div>

<div class="toast" id="toast"></div>

<script src="assets/calc/calc.js"></script>
<script src="assets/ak/ripple.js"></script>
<script src="assets/ak/transitions.js"></script>
<script src="assets/ak/progress.js"></script>
<script src="assets/ak/theme.js"></script>
</body>
</html>
